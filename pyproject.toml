[project]
name = "arceus"
version = "0.1.0"
description = "Compilador/interpretador da linguagem MiniLang desenvolvido para Teoria da Computação e Compiladores (UNIFACS 2026.2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
